name: ci

# Test, typecheck and lint every push and pull request on the oldest supported
# Node (18, package.json engines) and a current LTS, and check that the release
# zip ships the runtime files only. The release itself is built by release.yml
# on v* tags.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: install shell-test dependencies
        run: sudo apt-get update && sudo apt-get install -y gettext zip unzip
      - run: npm ci
      - run: npm run check

  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install gettext for the catalog validation
        run: sudo apt-get update && sudo apt-get install -y gettext
      - run: ./build-release.sh
      - name: zip contains the runtime files and nothing dev-only
        run: ./scripts/check-zip.sh
