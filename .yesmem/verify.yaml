languages:
  - name: node
    # npm test is the gate, but four suites load the `typescript` devDependency
    # at require time: tests/architecture/generated-types,
    # tests/architecture/zero-module-state, tests/model/minimum-fit-abc and
    # tests/tiling/minimum-fit-abc. The verifier's sandbox (bwrap: read-only
    # root, tmpfs /home, --unshare-net) has no node_modules and cannot install
    # any, so it runs the dependency-free subset instead.
    #
    # Both commands live in package.json, so the subset has one definition and
    # no count that drifts. Locally npm test and npm run check stay the full
    # gate, those four suites included.
    test_command: npm run test:no-deps
